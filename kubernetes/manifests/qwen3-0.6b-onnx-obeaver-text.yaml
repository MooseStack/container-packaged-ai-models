apiVersion: v1
kind: ServiceAccount
metadata:
  name: qwen3-0.6b-onnx-obeaver-text
  labels:
    app: qwen3-0.6b-onnx-obeaver-text
    app.kubernetes.io/name: model
    app.kubernetes.io/instance: qwen3-0.6b-onnx-obeaver-text
---
apiVersion: v1
kind: Service
metadata:
  name: qwen3-0.6b-onnx-obeaver-text
  labels:
    app: qwen3-0.6b-onnx-obeaver-text
    app.kubernetes.io/name: model
    app.kubernetes.io/instance: qwen3-0.6b-onnx-obeaver-text
spec:
  type: ClusterIP
  selector:
    app: qwen3-0.6b-onnx-obeaver-text
  ports:
    - name: http
      port: 8080
      targetPort: http
      protocol: TCP
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: qwen3-0.6b-onnx-obeaver-text
  labels:
    app: qwen3-0.6b-onnx-obeaver-text
    app.kubernetes.io/name: model
    app.kubernetes.io/instance: qwen3-0.6b-onnx-obeaver-text
spec:
  replicas: 1
  selector:
    matchLabels:
      app: qwen3-0.6b-onnx-obeaver-text
  template:
    metadata:
      labels:
        app: qwen3-0.6b-onnx-obeaver-text
    spec:
      serviceAccountName: qwen3-0.6b-onnx-obeaver-text
      containers:
        - name: model
          image: docker.io/moosestack/onnx-obeaver_qwen3-0.6b_cpu-x86-64:latest
          imagePullPolicy: Always
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
          startupProbe:
            tcpSocket:
              port: http
            failureThreshold: 30
            periodSeconds: 10
          readinessProbe:
            tcpSocket:
              port: http
            periodSeconds: 10
          livenessProbe:
            tcpSocket:
              port: http
            periodSeconds: 30
          resources:
            requests:
              cpu: "1"
              memory: 2Gi
            limits:
              cpu: "4"
              memory: 8Gi
