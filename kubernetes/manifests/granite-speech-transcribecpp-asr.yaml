apiVersion: v1
kind: ServiceAccount
metadata:
  name: granite-speech-transcribecpp-asr
  labels:
    app: granite-speech-transcribecpp-asr
    app.kubernetes.io/name: model
    app.kubernetes.io/instance: granite-speech-transcribecpp-asr
---
apiVersion: v1
kind: Service
metadata:
  name: granite-speech-transcribecpp-asr
  labels:
    app: granite-speech-transcribecpp-asr
    app.kubernetes.io/name: model
    app.kubernetes.io/instance: granite-speech-transcribecpp-asr
spec:
  type: ClusterIP
  selector:
    app: granite-speech-transcribecpp-asr
  ports:
    - name: http
      port: 8080
      targetPort: http
      protocol: TCP
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: granite-speech-transcribecpp-asr
  labels:
    app: granite-speech-transcribecpp-asr
    app.kubernetes.io/name: model
    app.kubernetes.io/instance: granite-speech-transcribecpp-asr
spec:
  replicas: 1
  selector:
    matchLabels:
      app: granite-speech-transcribecpp-asr
  template:
    metadata:
      labels:
        app: granite-speech-transcribecpp-asr
    spec:
      serviceAccountName: granite-speech-transcribecpp-asr
      containers:
        - name: model
          image: docker.io/moosestack/transcribe-cpp_granite-speech-5.0-470m-turboctc_cpu-x86-64:latest
          imagePullPolicy: Always
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
          startupProbe:
            tcpSocket:
              port: http
            failureThreshold: 30
            periodSeconds: 10
          readinessProbe:
            tcpSocket:
              port: http
            periodSeconds: 10
          livenessProbe:
            tcpSocket:
              port: http
            periodSeconds: 30
          resources:
            requests:
              cpu: "1"
              memory: 1Gi
            limits:
              cpu: "4"
              memory: 4Gi
