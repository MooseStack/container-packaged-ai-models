apiVersion: route.openshift.io/v1
kind: Route
metadata:
  name: nemotron-asr
  labels:
    app: nemotron-asr
spec:
  to:
    kind: Service
    name: nemotron-asr
    weight: 100
  port:
    targetPort: http
  tls:
    termination: edge
    insecureEdgeTerminationPolicy: Redirect
  wildcardPolicy: None
